<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>The Silicon Commute</title>
  <meta name="description" content="GAFAMと半導体の英語ニュース（英日対訳つき）">
  <meta name="theme-color" content="#0b2447" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c121c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Silicon Commute">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="alternate" type="application/rss+xml" title="The Silicon Commute" href="feed.xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="ホーム">
      <img src="icons/icon-192.png" alt="" width="32" height="32">
      <span class="brand-text"><b>The Silicon Commute</b><small>シリコン・コミュート</small></span>
    </a>
    <button class="icon-btn" id="btn-settings" aria-label="表示設定" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h11v2H3zm0 5h18v2H3zm0 5h8v2H3zm14-11h4v2h-4zm-4 10h8v2h-8z"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- display settings -->
  <dialog id="settings">
    <form method="dialog">
      <h2>表示設定</h2>
      <fieldset>
        <legend>スクリプト</legend>
        <div class="seg" role="radiogroup" id="mode-group">
          <label><input type="radio" name="mode" value="both"><span>英＋日</span></label>
          <label><input type="radio" name="mode" value="en"><span>英語のみ</span></label>
          <label><input type="radio" name="mode" value="quiz"><span>和訳を隠す</span></label>
          <label><input type="radio" name="mode" value="ja"><span>日本語のみ</span></label>
        </div>
        <p class="hint">「和訳を隠す」は、各行の「和訳」ボタンで1行ずつ確認できます。</p>
      </fieldset>
      <fieldset>
        <legend>文字サイズ</legend>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="size" value="s"><span>小</span></label>
          <label><input type="radio" name="size" value="m"><span>中</span></label>
          <label><input type="radio" name="size" value="l"><span>大</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>再生中の行に自動スクロール</legend>
        <label class="switch"><input type="checkbox" id="follow"><span>オン</span></label>
      </fieldset>
      <menu><button class="btn primary" value="ok">閉じる</button></menu>
    </form>
  </dialog>

  <!-- persistent player -->
  <section class="player" id="player" hidden aria-label="プレーヤー">
    <div class="player-meta">
      <span class="player-title" id="p-title"></span>
      <span class="player-time"><span id="p-cur">0:00</span> / <span id="p-dur">0:00</span></span>
    </div>
    <input type="range" id="p-seek" min="0" max="100" step="0.1" value="0" aria-label="再生位置">
    <div class="player-controls">
      <button class="icon-btn" id="p-speed" aria-label="再生速度">1.0×</button>
      <button class="icon-btn" id="p-back" aria-label="15秒戻る">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="system-ui" font-weight="700">15</text></svg>
      </button>
      <button class="play-btn" id="p-play" aria-label="再生">
        <svg class="i-play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="icon-btn" id="p-fwd" aria-label="15秒進む">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" fill="currentColor" font-family="system-ui" font-weight="700">15</text></svg>
      </button>
      <button class="icon-btn" id="p-save" aria-label="オフライン保存">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5zm7-3 5-5-1.4-1.4-2.6 2.6V4h-2v9.2l-2.6-2.6L7 12z"/></svg>
      </button>
    </div>
    <audio id="audio" preload="metadata" playsinline></audio>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
